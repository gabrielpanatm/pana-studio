<!doctype html>
<html lang="en-US" dir="ltr" data-pana-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#111315" />
    <script>
      (() => {
        const storageKey = "pana-studio-boot-projection-v1";
        const root = document.documentElement;
        const validInteger = (value) => Number.isSafeInteger(value) && value >= 0;
        const boundedText = (value, maximumLength) =>
          typeof value === "string" && value.length > 0 && value.length <= maximumLength;
        const validProjection = (value) =>
          value
          && typeof value === "object"
          && value.schemaVersion === 1
          && value.authority === "rust_application_settings"
          && value.settingsSchemaVersion === 3
          && validInteger(value.settingsRevision)
          && validInteger(value.systemGeneration)
          && boundedText(value.locale, 64)
          && (value.direction === "ltr" || value.direction === "rtl")
          && (value.theme === "light" || value.theme === "dark")
          && typeof value.accent === "string"
          && /^#[0-9a-f]{6}$/i.test(value.accent)
          && (value.contrast === null || value.contrast === "normal" || value.contrast === "high")
          && (value.reducedMotion === null || typeof value.reducedMotion === "boolean")
          && boundedText(value.loadingLabel, 200)
          && boundedText(value.loadingSubtitle, 300);
        const applyProjection = (projection) => {
          if (!validProjection(projection)) return false;
          const background = projection.theme === "light" ? "#edf1ee" : "#111315";
          const strongMixTarget = projection.theme === "dark" ? "white" : "black";
          root.lang = projection.locale;
          root.dir = projection.direction;
          root.dataset.panaLocale = projection.locale;
          root.dataset.panaTheme = projection.theme;
          root.dataset.panaContrast = projection.contrast ?? "normal";
          root.dataset.panaReducedMotion = projection.reducedMotion === true ? "true" : "false";
          root.dataset.panaBootAuthority =
            `${projection.settingsRevision}:${projection.systemGeneration}`;
          root.style.colorScheme = projection.theme;
          root.style.background = background;
          root.style.setProperty("--boot-brand", projection.accent);
          root.style.setProperty(
            "--boot-brand-strong",
            `color-mix(in srgb, ${projection.accent} 70%, ${strongMixTarget})`,
          );
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", background);
          const bootScreen = document.getElementById("pana-boot-screen");
          if (bootScreen) {
            bootScreen.setAttribute("aria-label", projection.loadingLabel);
            const subtitle = bootScreen.querySelector(".boot-subtitle");
            if (subtitle) subtitle.textContent = projection.loadingSubtitle;
          }
          window.__PANA_BOOT_PROJECTION__ = projection;
          return true;
        };
        window.__PANA_APPLY_BOOT_PROJECTION__ = applyProjection;

        try {
          const serialized = localStorage.getItem(storageKey);
          if (serialized && serialized.length <= 4096) {
            const projection = JSON.parse(serialized);
            if (applyProjection(projection)) return;
          }
        } catch {
          // The cache is an optional paint projection. Rust remains authoritative.
        }

        try {
          // First-run paint fallback while the native window remains hidden.
          const theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          root.dataset.panaTheme = theme;
          root.style.colorScheme = theme;
          root.style.background = theme === "light" ? "#edf1ee" : "#111315";
          const themeMeta = document.querySelector('meta[name="theme-color"]');
          themeMeta?.setAttribute("content", theme === "light" ? "#edf1ee" : "#111315");
        } catch {
          root.dataset.panaTheme = "dark";
        }
      })();
    </script>
    <style>
      :root {
        --boot-bg: #111315;
        --boot-surface: #171a1d;
        --boot-border: #24282c;
        --boot-text: #e7ede9;
        --boot-muted: #8b9790;
        --boot-brand: #1d7f6a;
        --boot-brand-strong: #2faa8c;
      }

      html[data-pana-theme="light"] {
        --boot-bg: #edf1ee;
        --boot-surface: #ffffff;
        --boot-border: #d8e0db;
        --boot-text: #1d2521;
        --boot-muted: #5f6c65;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
        background: var(--boot-bg);
      }

      html[data-pana-theme="light"],
      html[data-pana-theme="light"] body {
        background: var(--boot-bg);
      }

      html[data-pana-theme="dark"],
      html[data-pana-theme="dark"] body {
        background: var(--boot-bg);
      }

      #pana-boot-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        color: var(--boot-text);
        background:
          radial-gradient(circle at 18% 20%, color-mix(in srgb, var(--boot-brand) 13%, transparent), transparent 32%),
          radial-gradient(circle at 84% 18%, color-mix(in srgb, var(--boot-brand-strong) 10%, transparent), transparent 34%),
          var(--boot-bg);
        transition: opacity 160ms ease, visibility 160ms ease;
      }

      #pana-boot-screen.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-card {
        display: grid;
        justify-items: center;
        gap: 12px;
        min-width: 260px;
        padding: 24px 28px;
        border: 1px solid var(--boot-border);
        border-radius: 14px;
        background: color-mix(in srgb, var(--boot-surface) 88%, transparent);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.14);
      }

      .boot-title {
        margin: 0;
        font: 800 20px/1.2 "Urbanist Variable", "Inter Variable", Inter, ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0;
      }

      .boot-subtitle {
        margin: 0;
        color: var(--boot-muted);
        font: 500 12px/1.4 "Inter Variable", Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .boot-subtitle:empty {
        display: none;
      }

      .boot-loader {
        width: 140px;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: color-mix(in srgb, var(--boot-brand) 18%, transparent);
      }

      .boot-loader::before {
        content: "";
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--boot-brand), var(--boot-brand-strong));
        animation: pana-boot-slide 900ms ease-in-out infinite;
      }

      @keyframes pana-boot-slide {
        0% { transform: translateX(-110%); }
        55% { transform: translateX(90%); }
        100% { transform: translateX(260%); }
      }

      html[data-pana-contrast="high"] .boot-card {
        border-color: var(--boot-text);
      }

      html[data-pana-reduced-motion="true"] .boot-loader::before {
        width: 100%;
        opacity: 0.72;
        animation: none;
      }
    </style>
    <title>Pană Studio</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="pana-boot-screen" aria-label="Pană Studio">
      <div class="boot-card">
        <p class="boot-title">Pană Studio</p>
        <p class="boot-subtitle"></p>
        <div class="boot-loader" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      window.__PANA_APPLY_BOOT_PROJECTION__?.(window.__PANA_BOOT_PROJECTION__);
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
